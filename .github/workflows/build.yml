name: build

# Windows cannot be built on the Mac this is developed on: Tauri needs the MSVC
# toolchain and a resource compiler that do not exist there. So the Windows
# binary is built here, and this workflow is the only way it exists at all.
# Builds are deliberate, not automatic. The repo is public so the minutes are
# free, but a full macOS app build is a quarter of an hour and almost never
# what you want after a typo.
#
# So: the cheap core tests run on every push -- they are seconds, and they are
# the ones that catch real mistakes -- and the app builds wait to be asked for
# (Actions -> build -> Run workflow) or for a release tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # The shared core, checked on both platforms. It is the same code either way,
  # so a failure here is a real logic failure rather than a platform quirk.
  core:
    name: core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p fk-core --verbose
      # The Windows probe's own tests -- URL tidying, browser matching -- run
      # only on Windows, because the crate does not exist anywhere else.
      - if: runner.os == 'Windows'
        run: cargo test -p fk-probe-windows --verbose

  windows:
    name: Windows app
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\napp/src-tauri -> app/src-tauri/target"
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Text-mode probe first. It needs no installer, no permissions and no
      # overlay, so it is the cheapest possible way to find out whether the
      # accessibility tree gives up a URL on a real machine.
      - name: Build the probe CLI
        run: cargo build -p fk-cli --release
      - uses: actions/upload-artifact@v4
        with:
          name: focuskitty-probe-windows
          path: target/release/focuskitty.exe

      - name: Build the app
        working-directory: app
        run: |
          npm ci
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: focuskitty-windows
          # A green build that produced no installer is worse than a red one.
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe

  macos:
    name: macOS app (universal)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\napp/src-tauri -> app/src-tauri/target"
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Universal, so it opens on an Intel Mac too. The arm64-only build made
      # locally cannot even launch on one.
      - name: Build the app
        working-directory: app
        run: |
          npm ci
          npx tauri build --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: focuskitty-macos
          if-no-files-found: error
          path: app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

# Android is deliberately absent. Signing it needs the release keystore, which
# is not in this repository and must not be -- it is the one credential that
# cannot be reissued. The APK is built and signed locally.
