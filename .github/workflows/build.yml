name: build

# Windows cannot be built on the Mac this is developed on: Tauri needs the MSVC
# toolchain and a resource compiler that do not exist there. So the Windows
# binary is built here, and this workflow is the only way it exists at all.
# Builds are deliberate, not automatic. The repo is public so the minutes are
# free, but a full macOS app build is a quarter of an hour and almost never
# what you want after a typo.
#
# So: the cheap core tests run on every push -- they are seconds, and they are
# the ones that catch real mistakes -- and the app builds wait to be asked for
# (Actions -> build -> Run workflow) or for a release tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # The shared core, checked on both platforms. It is the same code either way,
  # so a failure here is a real logic failure rather than a platform quirk.
  core:
    name: core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p fk-core --verbose
      # The Windows probe's own tests -- URL tidying, browser matching -- run
      # only on Windows, because the crate does not exist anywhere else.
      - if: runner.os == 'Windows'
        run: cargo test -p fk-probe-windows --verbose
      # The whole workspace, not just the crate that changed. A probe crate
      # that compiles while the CLI calling it does not is a break that only
      # showed up ten minutes later in the app build.
      - run: cargo check --workspace --all-targets

  # A Windows machine with a real Chrome on it, which is the one thing this
  # project does not otherwise have. Rather than asking a person to install a
  # build, open a browser and describe what they see, ask the runner.
  uia:
    name: What can we read from Chrome?
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p fk-cli --release

      - name: Open Chrome on a real page
        shell: pwsh
        run: |
          $chrome = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (-not (Test-Path $chrome)) { $chrome = "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe" }
          Write-Host "chrome: $chrome  exists: $(Test-Path $chrome)"
          Start-Process $chrome -ArgumentList '--no-first-run','--no-default-browser-check','--hide-crash-restore-bubble','--new-window','https://www.youtube.com/watch?v=dQw4w9WgXcQ'
          Start-Sleep -Seconds 20

      - name: What the accessibility tree offers
        shell: pwsh
        run: .\target\release\focuskitty.exe uia 12 chrome.exe

      # The tree dump proves the address is READABLE. This proves what the
      # app's own code path actually returns -- current(), cache, predicate
      # and all -- which is the thing that has been answering "Google Chrome"
      # where it should answer "youtube.com".
      - name: What the tracker itself sees
        shell: pwsh
        # Straight to the job log, and ending by itself. Redirected to a file
        # and killed from outside, it wrote nothing at all.
        run: .\target\release\focuskitty.exe probe 10

      # The question every fix so far has failed to answer: does the clock
      # actually advance while a watched site sits in front of you, with
      # nobody touching anything? Four fixes have been shipped on reasoning
      # about symptoms relayed from a machine I cannot see. This answers it
      # here, before anything is published.
      - name: Does the timer actually run?
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\target\release\focuskitty.exe add youtube.com 60 --mode foreground-only
          .\target\release\focuskitty.exe rules

          # Chrome is ALREADY open on YouTube from the earlier step. Killing
          # and relaunching it brings back a "Restore pages?" prompt instead
          # of the page, which would fail this test for a reason that has
          # nothing to do with the clock.

          # What does the tracker see right now? If this is wrong, the timer
          # result below means nothing.
          Write-Host "--- what is in front before we start"
          .\target\release\focuskitty.exe probe 3

          # Nothing touches the machine for the next 40 seconds. If the clock
          # only moves when something happens, it will show here as zero.
          Write-Host "--- running the timers for 40s, untouched"
          $out = .\target\release\focuskitty.exe watch --for 40 2>&1 | Out-String
          Write-Host $out

          $m = [regex]::Match($out, 'used_ms=(\d+)')
          if (-not $m.Success) { throw "nothing was tracked at all over 40 seconds" }
          $used = [int]$m.Groups[1].Value
          Write-Host "used_ms = $used"
          # 40 seconds untouched should charge close to 40,000ms. Half that is
          # a generous floor and still catches a clock that only moves when
          # something happens to it.
          if ($used -lt 20000) {
            throw "the clock barely moved: ${used}ms over 40 seconds untouched"
          }
          Write-Host "PASS: ${used}ms charged over 40s with nobody touching the machine"

      # And again with accessibility forced on, to find out whether that is
      # the difference between a readable address and silence.
      - name: Again, with renderer accessibility forced
        if: always()
        shell: pwsh
        run: |
          Get-Process chrome -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          $chrome = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (-not (Test-Path $chrome)) { $chrome = "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe" }
          Start-Process $chrome -ArgumentList '--no-first-run','--hide-crash-restore-bubble','--force-renderer-accessibility','--new-window','https://www.youtube.com/watch?v=dQw4w9WgXcQ'
          Start-Sleep -Seconds 20
          .\target\release\focuskitty.exe uia 12 chrome.exe

  windows:
    name: Windows app
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\napp/src-tauri -> app/src-tauri/target"
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Text-mode probe first. It needs no installer, no permissions and no
      # overlay, so it is the cheapest possible way to find out whether the
      # accessibility tree gives up a URL on a real machine.
      - name: Build the probe CLI
        run: cargo build -p fk-cli --release
      - uses: actions/upload-artifact@v4
        with:
          name: focuskitty-probe-windows
          path: target/release/focuskitty.exe

      - name: Build the app
        working-directory: app
        run: |
          npm ci
          npx tauri build

      # THE APP, not the command-line tool.
      #
      # Every check so far ran `focuskitty.exe watch`, which has no windows --
      # and every stall reported has come from the parts that do. Six fixes
      # went out against a clock that stops, each argued from symptoms relayed
      # off a machine nobody could inspect, because nothing here had ever run
      # the real thing.
      - name: Does the APP's clock run, untouched?
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "app\src-tauri\target\release\focuskitty.exe"
          $data = "$env:APPDATA\FocusKitty"
          Remove-Item "$data\diary" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$data\focuskitty.log" -Force -ErrorAction SilentlyContinue

          $chrome = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (-not (Test-Path $chrome)) { $chrome = "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe" }
          Get-Process chrome -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

          # The rule goes in through the CLI, which shares the same config.
          .\target\release\focuskitty.exe add youtube.com 60 --mode foreground-only

          # The app FIRST, then the browser. Started the other way round, the
          # app's own window is left frontmost with nobody there to click
          # away from it -- and "FocusKitty is in front" is correctly counted
          # as nothing being watched.
          Write-Host "--- starting the app"
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          Start-Process $chrome -ArgumentList '--no-first-run','--hide-crash-restore-bubble','--new-window','https://www.youtube.com/watch?v=dQw4w9WgXcQ'
          Write-Host "--- Chrome is in front. NOT touching anything for 95 seconds"
          Start-Sleep -Seconds 95
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          Write-Host "--- the app's own log"
          if (Test-Path "$data\focuskitty.log") { Get-Content "$data\focuskitty.log" -Tail 40 }
          else { Write-Host "(no log written)" }

          $day = Get-Date -Format 'yyyy-MM-dd'
          $log = "$data\diary\$day.json"
          if (-not (Test-Path $log)) { throw "the app tracked nothing at all in 95 seconds" }
          $raw = Get-Content $log -Raw
          $used = [int]([regex]::Match($raw, '"used_ms"\s*:\s*(\d+)')).Groups[1].Value
          Write-Host "used_ms = $used"
          if ($used -lt 45000) {
            throw "the APP's clock barely moved: ${used}ms over 95 seconds untouched"
          }
          Write-Host "PASS: the app charged ${used}ms over 95 seconds with nobody touching it"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focuskitty-app-log
          path: ${{ env.APPDATA }}\FocusKitty\focuskitty.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: focuskitty-windows
          # A green build that produced no installer is worse than a red one.
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe

  macos:
    name: macOS app (universal)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\napp/src-tauri -> app/src-tauri/target"
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Universal, so it opens on an Intel Mac too. The arm64-only build made
      # locally cannot even launch on one.
      - name: Build the app
        working-directory: app
        run: |
          npm ci
          npx tauri build --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: focuskitty-macos
          if-no-files-found: error
          path: app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

# Android is deliberately absent. Signing it needs the release keystore, which
# is not in this repository and must not be -- it is the one credential that
# cannot be reissued. The APK is built and signed locally.
