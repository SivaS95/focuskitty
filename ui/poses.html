<!doctype html>
<html><head><meta charset="utf-8"><title>FocusKitty — pose sheet</title>
<link rel="stylesheet" href="cat.css">
<style>
 body{margin:0;background:#eef1f6;font:12px ui-rounded,system-ui,sans-serif;color:#333}
 .grid{display:grid;grid-template-columns:repeat(4,1fr)}
 .cell{position:relative;border:1px solid #dde2ea;background:#f7f9fc;height:260px}
 .cell b{position:absolute;top:6px;left:8px;z-index:9;font:600 12px ui-rounded,system-ui;
   letter-spacing:.04em;text-transform:uppercase;color:#6b7280}
 .cell .ground{position:absolute;left:0;right:0;top:205px;border-top:1px dashed #c3ccd9}
 .holder{position:absolute;inset:0}
</style></head><body>
<div class="grid" id="grid"></div>
<script type="module">
import { Cat } from "./cat.js";
import { POSE_NAMES } from "./poses.js";
const grid = document.getElementById("grid");
for (const name of POSE_NAMES) {
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.innerHTML = `<b>${name}</b><div class="ground"></div><div class="holder"></div>`;
  grid.appendChild(cell);
  new Cat(cell.querySelector(".holder"), { pose: name });
}
</script></body></html>
